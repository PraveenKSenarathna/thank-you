<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | Praveen K Senarathna</title>
    <style>
        /* Dynamic Gradient Background */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden; /* Hide scrollbars for floating elements */
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Background Elements */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            animation: float 10s infinite ease-in-out;
            z-index: 0;
        }

        .shape1 { width: 100px; height: 100px; left: 10%; top: 20%; animation-delay: 0s; }
        .shape2 { width: 150px; height: 150px; right: 15%; top: 10%; animation-delay: -2s; }
        .shape3 { width: 80px; height: 80px; left: 20%; bottom: 15%; animation-delay: -4s; }
        .shape4 { width: 120px; height: 120px; right: 10%; bottom: 20%; animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Upgraded Glassmorphism Card */
        .card {
            position: relative;
            z-index: 1; /* Stay above floating shapes */
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1), inset 0 0 0 2px rgba(255,255,255,0.5);
            text-align: center;
            max-width: 450px;
            width: 85%;
            backdrop-filter: blur(15px);
            animation: popIn 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.7;
            color: #444;
        }

        .signature {
            margin-top: 35px;
            font-weight: 800;
            font-size: 1.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Awesome Button */
        button {
            margin-top: 30px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: #d6336c;
            font-weight: bold;
            border: 2px solid white;
            padding: 15px 35px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 154, 158, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 154, 158, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 154, 158, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 154, 158, 0); }
        }
    </style>
</head>
<body>
    <!-- Floating background shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <div class="card">
        <h1>Thank You! 🎂</h1>
        <p>I'm incredibly grateful for all the wonderful wishes, messages, and love I received today. Thank you for making my 23rd birthday so special!</p>
        <div class="signature">~ Praveen K Senarathna ~</div>
        <button onclick="fireConfetti()">Celebrate!</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // Fire the new fireworks confetti after a slight delay on load
        window.onload = function() {
            setTimeout(fireConfetti, 600);
        };
    </script>
</body>
</html>
