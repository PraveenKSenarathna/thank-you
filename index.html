<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | Praveen K Senarathna</title>
    <style>
        /* Body with Background Image */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Festive background image with a dark overlay to make the card pop */
            background: linear-gradient(rgba(20, 20, 30, 0.5), rgba(20, 20, 30, 0.7)), 
                        url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            overflow: hidden; 
            color: #333;
        }

        /* Glassmorphism Card */
        .card-container {
            position: relative;
            z-index: 1;
            animation: popIn 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.5);
            text-align: center;
            max-width: 450px;
            width: 85vw;
            backdrop-filter: blur(15px);
            position: relative;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Emoji Stickers */
        .sticker {
            position: absolute;
            font-size: 3.5em;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
            z-index: 10;
            user-select: none;
            animation: floatSticker 4s ease-in-out infinite;
        }

        .sticker-1 { top: -30px; left: -20px; --rot: -15deg; } /* Boy */
        .sticker-2 { bottom: -25px; right: -20px; --rot: 15deg; animation-delay: -1s; } /* Cool Boy */
        .sticker-3 { top: 35%; right: -35px; --rot: 20deg; animation-delay: -2s; font-size: 2.8em; } /* Tech Boy */
        .sticker-4 { bottom: 15%; left: -30px; --rot: -20deg; animation-delay: -3s; font-size: 2.8em; } /* Party Face */

        @keyframes floatSticker {
            0%, 100% { transform: translateY(0) rotate(var(--rot)); }
            50% { transform: translateY(-15px) rotate(calc(var(--rot) + 10deg)); }
        }

        h1 {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.7;
            color: #444;
            font-weight: 500;
        }

        .signature {
            margin-top: 35px;
            font-weight: 800;
            font-size: 1.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Awesome Button */
        button {
            margin-top: 30px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: #d6336c;
            font-weight: bold;
            border: 2px solid white;
            padding: 15px 35px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 154, 158, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 154, 158, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 154, 158, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 154, 158, 0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Floating Stickers -->
        <div class="sticker sticker-1">👦</div>
        <div class="sticker sticker-2">😎</div>
        <div class="sticker sticker-3">👨‍💻</div>
        <div class="sticker sticker-4">🥳</div>

        <div class="card">
            <h1>Thank You! 🎂</h1>
            <p>I'm incredibly grateful for all the wonderful wishes, messages, and love I received today. Thank you for making my 23rd birthday so special!</p>
            <div class="signature">~ Praveen K Senarathna ~</div>
            <button onclick="fireConfetti()">Celebrate!</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        window.onload = function() {
            setTimeout(fireConfetti, 600);
        };
    </script>
</body>
</html>
