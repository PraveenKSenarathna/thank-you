<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | Praveen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Modern gradient background */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 85%;
            /* Subtle glassmorphism blur */
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
        }

        .signature {
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
        }

        button {
            margin-top: 25px;
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #667eea;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Thank You! 🎉</h1>
    <p>I'm so grateful for all the wonderful wishes, messages, and love I received today. Thank you for making my 23rd birthday so incredibly special!</p>
    <div class="signature">- Praveen</div>
    <button onclick="fireConfetti()">Celebrate!</button>
</div>

<!-- Canvas Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    // Function to trigger the confetti effect
    function fireConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#667eea', '#764ba2', '#ffffff']
        });
    }

    // Automatically fire confetti a half-second after the page loads
    window.onload = function() {
        setTimeout(fireConfetti, 500);
    };
</script>

</body>
</html>
